name: Sync & Deploy DealWell
on:
  push:
    branches: [master]
  schedule:
    - cron: '0 * * * *'      # hourly
  workflow_dispatch: {}       # manual run button
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: dealwell-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build catalog from Sheet + Drive (only if API key is set)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          if [ -n "$GOOGLE_API_KEY" ]; then
            npm run build
          else
            echo "GOOGLE_API_KEY not set yet — deploying with sample data for now."
          fi
      - name: Clean test files out of the published site
        run: rm -f site/assets/*.test.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
